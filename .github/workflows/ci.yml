name: YeboPets CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Test Android app
        working-directory: YeboPets
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest lintDebug assembleRelease assembleDebugAndroidTest

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test API
        run: dotnet test api.Tests/YeboPets.Api.Tests.csproj --configuration Release
